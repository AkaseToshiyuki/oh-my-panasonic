name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-evdev python3-pulsectl gir1.2-nm-1.0 gir1.2-gtk-4.0 gir1.2-adw-1
      - run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
      - run: python3 tools/check_release.py
      - run: node tests/test_statusbar.mjs
  wheelpad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libsystemd-dev
      - run: umask 077; cargo test --locked
        working-directory: vendor/letsnote-wheelpad
